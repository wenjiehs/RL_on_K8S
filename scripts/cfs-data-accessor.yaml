apiVersion: v1
kind: Pod
metadata:
  name: cfs-data-accessor
  namespace: default
  labels:
    app: rl-console
    component: data-accessor
spec:
  containers:
  - name: accessor
    image: busybox:latest
    command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    volumeMounts:
    - name: rl-data
      mountPath: /cfs
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
  volumes:
  - name: rl-data
    persistentVolumeClaim:
      claimName: rl-data-storage
  restartPolicy: Always