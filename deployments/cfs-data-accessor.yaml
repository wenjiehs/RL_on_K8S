apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfs-data-accessor
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfs-data-accessor
  template:
    metadata:
      labels:
        app: cfs-data-accessor
    spec:
      containers:
      - name: cfs-data-accessor
        image: alpine:latest
        command: ["/bin/sh", "-c", "--"]
        args:
        - |
          # 安装必要工具
          apk add --no-cache curl jq python3

          # 创建数据目录
          echo "🚀 Initializing unified storage access..."
          echo "Storage Path: /mnt/cfs"
          echo "PVC: cfs-rl-data-pvc (10Ti)"
          
          # 创建rl-data目录
          mkdir -p /mnt/cfs/rl-data
          
          # 显示存储状态
          echo "📊 Storage Status:"
          ls -la /mnt/cfs/
          echo ""
          echo "📁 RL Data Directory:"
          ls -la /mnt/cfs/rl-data/ || echo "Directory is empty"
          
          # 启动HTTP服务器提供统一存储访问API
          cd /mnt/cfs
          echo "🌐 Starting HTTP server on port 8080..."
          echo "Access URL: http://cfs-data-accessor-service:8080"
          python3 -m http.server 8080 --bind 0.0.0.0
        volumeMounts:
        - name: unified-storage-pvc
          mountPath: /mnt/cfs
      volumes:
      - name: unified-storage-pvc
        persistentVolumeClaim:
          claimName: cfs-rl-data-pvc-new
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cfs-data-accessor-service
  namespace: default
spec:
  selector:
    app: cfs-data-accessor
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP