apiVersion: v1
kind: Pod
metadata:
  name: test-pvc-mount
  namespace: default
spec:
  containers:
  - name: test-container
    image: alpine:latest
    command: ["/bin/sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: unified-storage
      mountPath: /mnt/cfs
  volumes:
  - name: unified-storage
    persistentVolumeClaim:
      claimName: cfs-rl-data-pvc
  restartPolicy: Never